<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Alias para el directorio de uploads (está fuera de public)
    Alias /uploads /var/www/html/uploads
    <Directory /var/www/html/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ELIMINAR ESTE BLOQUE COMPLETO
    # <IfModule mod_headers.c>
    #     Header always set Access-Control-Allow-Origin "http://localhost:3000"
    #     Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    #     Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    #     Header always set Access-Control-Allow-Credentials "true"
    # </IfModule>

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Reescritura de URLs para el frontend
        RewriteEngine On
        RewriteBase /
        
        # Responder OPTIONS con 200
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule ^(.*)$ $1 [R=200,L]
        
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    # Configuración para API
    <Directory /var/www/html/public/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Seguridad: prevenir acceso directo a archivos PHP fuera de public
    <DirectoryMatch "^/var/www/html/(app|config|database)/">
        Require all denied
    </DirectoryMatch>

    # Configuración de logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Límites de subida. Los adjuntos tienen su propio límite (MAX_FILE_SIZE, 5 MB,
    # en config/config.php); estos valores son para importar backups JSON, que
    # incluyen todos los adjuntos en Base64 y pueden pesar cientos de MB.
    # Si se cambian, actualizar también client_max_body_size en frontend/nginx.conf
    # y MAX_IMPORT_MB en frontend/src/components/movements/MovementModals.jsx.
    php_value upload_max_filesize 256M
    php_value post_max_size 260M
    # Decodificar un JSON ocupa ~3 veces su tamaño en memoria (medido: 29 MB -> 86 MB)
    php_value memory_limit 1024M
    php_value max_execution_time 600
    php_value max_input_time 600
</VirtualHost>