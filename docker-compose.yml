services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: gastos_db
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    environment:
      # Las contraseñas están en .env (no se sube a GitHub). Estas variables solo
      # crean los usuarios la primera vez; para cambiarlas en una instalación
      # existente usar scripts/cambiar_contrasenas_bd.sh
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en .env (ejecuta scripts/cambiar_contrasenas_bd.sh)}
      MYSQL_DATABASE: gastos_db
      MYSQL_USER: gastos_user
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?Falta DB_APP_PASSWORD en .env (ejecuta scripts/cambiar_contrasenas_bd.sh)}
      TZ: Europe/Madrid
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Sin "ports": MySQL solo es accesible dentro de la red de Docker
    # (backend y phpMyAdmin), no desde otros dispositivos
    networks:
      - gastos_network

  # Backend PHP
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gastos_backend
    restart: unless-stopped
    volumes:
      #- ./backend:/var/www/html
      - ./uploads:/var/www/html/uploads
    ports:
      - "8082:80"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: gastos_db
      DB_USER: gastos_user
      DB_PASS: ${DB_APP_PASSWORD:?Falta DB_APP_PASSWORD en .env (ejecuta scripts/cambiar_contrasenas_bd.sh)}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    networks:
      - gastos_network

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GITHUB_REPO_URL=${GITHUB_REPO_URL}
    container_name: gastos_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gastos_network

  # Bot de Telegram
  telegram_bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: gastos_telegram_bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_URL: http://backend:80/api
      TZ: Europe/Madrid
    depends_on:
      - backend
    networks:
      - gastos_network

  # phpMyAdmin, para corregir datos a mano desde cualquier dispositivo de la red.
  # Pide usuario y contraseña (gastos_user / DB_APP_PASSWORD de .env) y no
  # permite entrar como root (ver phpmyadmin/config.user.inc.php).
  # No redirigir este puerto en el router: no debe ser accesible desde Internet.
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gastos_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    volumes:
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    depends_on:
      - db
    networks:
      - gastos_network

networks:
  gastos_network:
    driver: bridge