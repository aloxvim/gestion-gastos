server {
    listen 80;
    server_name localhost;

    # Servir archivos estáticos del frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend API
    location /api/ {
        # Debe ser >= post_max_size de PHP (backend/apache-config.conf): los
        # backups JSON incluyen todos los adjuntos y pueden pesar cientos de MB
        client_max_body_size 260M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://gastos_backend:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy a uploads
    location /uploads/ {
        proxy_pass http://gastos_backend:80/uploads/;
    }
}